// ── Constants ────────────────────────────────────────────────────────────────
const CATEGORIES    = ['Family','Friends','Professional Network'];
const FREQUENCIES   = ['Weekly','Biweekly','Monthly','Seasonally'];
const CONTACT_PREFS = ['Text','Call','Email','DM / Social'];
const FREQ_DAYS     = {Weekly:7,Biweekly:14,Monthly:30,Seasonally:90};
const EVENT_TYPES   = ['Coffee','Dinner','Movie Night','Happy Hour','Lunch','Walk'];
const EVENT_ICONS   = {Coffee:'☕',Dinner:'🍽️','Movie Night':'🎬','Happy Hour':'🍹',Lunch:'🥗',Walk:'🚶🏾'};
const PHOTO_EMOJIS  = ['👤','👴🏾','👵🏾','👨🏾','👩🏾','👨🏾‍💼','👩🏾‍💼','👨🏾‍🎓','👩🏾‍🎓','🧑🏾','👦🏾','👧🏾','👴','👵','👨','👩','🧑'];

// ── Utilities ────────────────────────────────────────────────────────────────
const daysSince = (ds) => ds ? Math.floor((Date.now()-new Date(ds).getTime())/86400000) : null;
const daysAgo   = (n)  => { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); };
const isOverdue = (p)  => { const d=daysSince(p.lastContactDate); return d===null||d>=(FREQ_DAYS[p.frequency]||30); };

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const nextBirthday = (str) => {
  if(!str) return null;
  const parts=str.trim().split(/\s+/);
  if(parts.length<2) return null;
  const mi=MONTHS.findIndex(m=>m.toLowerCase().startsWith(parts[0].toLowerCase()));
  const day=parseInt(parts[1]);
  if(mi===-1||isNaN(day)) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const d=new Date(now.getFullYear(),mi,day);
  if(d<now) d.setFullYear(d.getFullYear()+1);
  return d;
};
const daysFromNow = (date) => {
  if(!date) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((new Date(date)-now)/86400000);
};
const duLabel = (n) => {
  if(n===0) return 'Today';
  if(n===1) return 'Tomorrow';
  if(n<=6){ const d=new Date(); d.setDate(d.getDate()+n); return d.toLocaleDateString('en-US',{weekday:'long'}); }
  return `in ${n} days`;
};
const toDateInput = (iso) => iso ? new Date(iso).toISOString().split('T')[0] : '';
const fromDateInput = (s) => s ? new Date(s+'T12:00:00').toISOString() : null;

// Resize + compress an image File to a base64 JPEG (max 400px, ~60KB)
const compressImage = (file) => new Promise(resolve => {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    URL.revokeObjectURL(url);
    const max=400, r=Math.min(max/img.width, max/img.height, 1);
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    resolve(c.toDataURL('image/jpeg',0.72));
  };
  img.src=url;
});

// ── Shared UI ────────────────────────────────────────────────────────────────

// Renders a person's photo — real image if uploaded, emoji fallback otherwise

// ── ScheduleModal ────────────────────────────────────────────────────────────
function ScheduleModal({person,onSave,onClose,existingEvent}) {
  const isEdit=!!existingEvent;
  const initType=existingEvent?(EVENT_TYPES.includes(existingEvent.type)?existingEvent.type:'custom'):'Coffee';
  const initCustom=existingEvent&&!EVENT_TYPES.includes(existingEvent.type)?existingEvent.type:'';
  const [type,setType]=useState(initType);
  const [custom,setCustom]=useState(initCustom);
  const [date,setDate]=useState(existingEvent?existingEvent.date:new Date().toISOString().split('T')[0]);
  const [location,setLocation]=useState(existingEvent?existingEvent.location||'':'');
  const isCustom=type==='custom';
  const save=()=>{
    if(!date) return;
    const finalType=isCustom?(custom.trim()||'Hangout'):type;
    if(isEdit) onSave({...existingEvent,type:finalType,date,location});
    else onSave({id:Date.now(),personId:person.id,personName:person.name,type:finalType,date,location});
    onClose();
  };
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',display:'flex',
      alignItems:'flex-end',justifyContent:'center',zIndex:1000}}>
      <div style={{background:'white',borderRadius:'24px 24px 0 0',padding:24,width:'100%',maxWidth:480,paddingBottom:40}}>
        <h3 style={{fontFamily:'Georgia,serif',color:C.primary,marginBottom:4,fontSize:20}}>
          {isEdit?'Edit Meetup':`Plan time with ${person.name}`}
        </h3>
        <p style={{color:C.textLight,fontSize:13,marginBottom:20}}>What are you planning?</p>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:12,color:C.textLight,marginBottom:8,fontWeight:500}}>Type</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {EVENT_TYPES.map(t=>(
              <button key={t} onClick={()=>setType(t)} style={{
                padding:'8px 14px',borderRadius:20,fontSize:13,
                background:type===t?C.accent1:C.light,
                color:type===t?'white':C.primary,fontWeight:type===t?600:400}}>
                {EVENT_ICONS[t]} {t}
              </button>
            ))}
            <button onClick={()=>setType('custom')} style={{
              padding:'8px 14px',borderRadius:20,fontSize:13,
              background:isCustom?C.accent1:C.light,
              color:isCustom?'white':C.primary,fontWeight:isCustom?600:400}}>
              ✏️ Other
            </button>
          </div>
          {isCustom&&(
            <input value={custom} onChange={e=>setCustom(e.target.value)}
              placeholder="e.g. Game night, Road trip, Brunch..."
              style={{...iSx,marginTop:12}}/>
          )}
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:12,color:C.textLight,marginBottom:8,fontWeight:500}}>Date</div>
          <input type="date" value={date} min={new Date().toISOString().split('T')[0]}
            onChange={e=>setDate(e.target.value)} style={iSx}/>
        </div>
        <div style={{marginBottom:24}}>
          <div style={{fontSize:12,color:C.textLight,marginBottom:8,fontWeight:500}}>Location <span style={{fontWeight:400,opacity:.6}}>(optional)</span></div>
          <input value={location} onChange={e=>setLocation(e.target.value)}
            placeholder="e.g. Starbucks on Main St, Zoom, Their place…" style={iSx}/>
        </div>
        <div style={{display:'flex',gap:10}}>
          <button onClick={onClose} style={{flex:1,padding:14,borderRadius:12,background:C.light,color:C.primary,fontSize:14}}>Cancel</button>
          <button onClick={save} style={{flex:1,padding:14,borderRadius:12,
            background:'linear-gradient(135deg,#D99C7C 0%,#F3C46F 100%)',color:'white',fontSize:14}}>{isEdit?'Save Changes':'Save'}</button>
        </div>
      </div>
    </div>
  );
}

// ── EventDetailModal ─────────────────────────────────────────────────────────
function EventDetailModal({event,person,onUpdate,onDelete,onClose}) {
  const [editing,setEditing]=useState(false);
  const n=daysFromNow(event.date+'T12:00:00');
  const dateStr=new Date(event.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  if(editing) return (
    <ScheduleModal person={person} existingEvent={event}
      onSave={e=>{onUpdate(e);onClose();}}
      onClose={()=>setEditing(false)}/>
  );
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',display:'flex',
      alignItems:'flex-end',justifyContent:'center',zIndex:1000}}>
      <div style={{background:'white',borderRadius:'24px 24px 0 0',padding:28,width:'100%',maxWidth:480,paddingBottom:44}}>
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:52,marginBottom:10}}>{EVENT_ICONS[event.type]||'📅'}</div>
          <h3 style={{fontFamily:'Georgia,serif',color:C.primary,fontSize:22,marginBottom:4}}>{event.type}</h3>
          <p style={{color:C.textLight,fontSize:14,marginBottom:4}}>with {event.personName}</p>
          <p style={{color:C.primary,fontSize:15,fontWeight:500,marginBottom:2}}>{dateStr}</p>
          <p style={{color:C.accent1,fontSize:13,fontWeight:600,marginBottom:event.location?6:0}}>{duLabel(n)}</p>
          {event.location&&<p style={{color:C.textLight,fontSize:13}}>📍 {event.location}</p>}
        </div>
        <div style={{display:'flex',gap:10,marginBottom:12}}>
          <button onClick={()=>setEditing(true)} style={{flex:1,padding:14,borderRadius:12,
            background:C.light,color:C.primary,fontSize:14,fontWeight:500}}>Edit</button>
          <button onClick={()=>{onDelete(event.id);onClose();}} style={{flex:1,padding:14,borderRadius:12,
            background:'#FEE2E2',color:'#DC2626',fontSize:14,fontWeight:500}}>Cancel Event</button>
        </div>
        <button onClick={onClose} style={{width:'100%',padding:14,borderRadius:12,
          background:'transparent',color:C.textLight,fontSize:14}}>Close</button>
      </div>
    </div>
  );
}

// ── HomeView ─────────────────────────────────────────────────────────────────
function HomeView({people,events,navigate,onEventClick}) {
  const overdue  = people.filter(isOverdue);
  const weekCount= people.filter(p=>{ const d=daysSince(p.lastContactDate); return d!==null&&d<=7; }).length;
  const todayStr = new Date().toISOString().split('T')[0];

  // Birthdays in next 30 days
  const upcomingBdays = people
    .map(p=>({p,d:nextBirthday(p.birthday),n:daysFromNow(nextBirthday(p.birthday))}))
    .filter(x=>x.n!==null&&x.n>=0&&x.n<=30)
    .sort((a,b)=>a.n-b.n);

  // Upcoming meetup events
  const upcomingEvents = (events||[])
    .filter(e=>e.date>=todayStr)
    .map(e=>({...e,n:daysFromNow(e.date+'T12:00:00')}))
    .sort((a,b)=>a.n-b.n)
    .slice(0,8);

  const allUpcoming = [
    ...upcomingBdays.map(x=>({key:'b'+x.p.id,icon:'🎂',label:`${x.p.name}'s Birthday`,when:duLabel(x.n),n:x.n,accent:C.accent2})),
    ...upcomingEvents.map(e=>({key:'e'+e.id,icon:EVENT_ICONS[e.type]||'📅',label:`${e.type} with ${e.personName}`,when:duLabel(e.n),n:e.n,accent:C.light,event:e}))
  ].sort((a,b)=>a.n-b.n);

  // Action items
  const actions=[];
  upcomingBdays.filter(x=>x.n<=14).forEach(x=>{
    actions.push({icon:'🎁',text:`Get a gift for ${x.p.name}`,sub:`Birthday ${duLabel(x.n)}`});
  });

  return (
    <div style={{paddingBottom:100}}>
      <div style={{marginBottom:28}}>
        <h1 style={{fontSize:28,fontFamily:'Georgia,serif',color:C.primary,marginBottom:4}}>Blessing,</h1>
        <p style={{fontSize:16,color:C.textLight}}>here are the people on your heart today.</p>
      </div>

      {/* Bubbles */}
      <div className="hs" style={{display:'flex',gap:16,overflowX:'auto',margin:'0 -24px 28px',padding:'4px 24px 12px'}}>
        {people.map(p=>{
          const d=daysSince(p.lastContactDate), over=isOverdue(p);
          return (
            <div key={p.id} onClick={()=>navigate('profile',p)} style={{flexShrink:0,textAlign:'center',cursor:'pointer'}}>
              <div style={{marginBottom:6,boxShadow:'0 2px 10px rgba(0,0,0,.12)',borderRadius:'50%',
                outline:over?`2.5px solid ${C.accent1}`:'none',outlineOffset:2}}>
                <PersonPhoto person={p} size={72} fontSize={34}/>
              </div>
              <div style={{fontSize:12,fontWeight:600,color:C.primary,marginBottom:2}}>{p.name}</div>
              <div style={{fontSize:11,color:over?C.accent1:C.textLight}}>
                {d===null?'Never':d===0?'Today':`${d}d`}
              </div>
            </div>
          );
        })}
        <div onClick={()=>navigate('add')} style={{flexShrink:0,textAlign:'center',cursor:'pointer'}}>
          <div style={{width:72,height:72,borderRadius:'50%',display:'flex',alignItems:'center',
            justifyContent:'center',border:`2px dashed ${C.accent1}`,background:C.card,marginBottom:6}}>
            <Plus size={26} color={C.accent1}/>
          </div>
          <div style={{fontSize:11,color:C.textLight}}>Add</div>
        </div>
      </div>

      {/* Upcoming dates */}
      {allUpcoming.length>0&&(
        <div style={{marginBottom:28}}>
          <h2 style={{fontSize:20,fontFamily:'Georgia,serif',color:C.primary,marginBottom:14}}>Coming Up</h2>
          <div className="hs" style={{display:'flex',gap:12,overflowX:'auto',margin:'0 -24px',padding:'4px 24px 8px'}}>
            {allUpcoming.map(item=>(
              <div key={item.key} onClick={item.event?()=>onEventClick(item.event):undefined}
                style={{flexShrink:0,padding:'14px 16px',borderRadius:16,
                background:item.accent,minWidth:140,maxWidth:160,
                cursor:item.event?'pointer':'default'}}>
                <div style={{fontSize:26,marginBottom:6}}>{item.icon}</div>
                <div style={{fontWeight:600,color:C.primary,fontSize:13,lineHeight:1.3,marginBottom:4}}>{item.label}</div>
                <div style={{fontSize:12,color:C.primary,opacity:.65}}>{item.when}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Action items */}
      {actions.length>0&&(
        <div style={{marginBottom:28}}>
          <h2 style={{fontSize:20,fontFamily:'Georgia,serif',color:C.primary,marginBottom:14}}>To-Do List</h2>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {actions.map((a,i)=>(
              <div key={i} style={{padding:16,borderRadius:16,background:C.card,
                display:'flex',alignItems:'center',gap:14,
                ...(a.person?{cursor:'pointer'}:{})}
              } onClick={a.person?()=>navigate('profile',a.person):undefined}>
                <div style={{fontSize:28,flexShrink:0}}>{a.icon}</div>

// ── AddEditView ───────────────────────────────────────────────────────────────
function AddEditView({person,onSave,showToast}) {
  const blank = {
    name:'',relationship:'',category:'Friends',photo:'👤',photoData:null,
    birthday:'',frequency:'Monthly',notes:'',phone:'',email:'',
    contactPref:'Text',howWeMet:'',city:'',lastContactDate:null
  };
  const [form,setForm]=useState(person?{...blank,...person}:blank);
  const [showEmojiPicker,setShowEmojiPicker]=useState(false);
  const [err,setErr]=useState('');
  const fileRef=React.useRef();
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const handlePhotoUpload=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const data=await compressImage(file);
    setForm(f=>({...f,photoData:data}));
  };

  const vcfRef=React.useRef();

  const parseVCard=(text)=>{
    const get=(key)=>{
      const re=new RegExp(`^${key}[^:]*:(.+)$`,'mi');
      const m=text.match(re);
      return m?m[1].trim().replace(/\\n/g,' '):'';
    };
    const fn=get('FN');
    const tel=get('TEL');
    const email=get('EMAIL');
    // ADR field: ;;street;city;state;zip;country
    const adr=get('ADR');
    const city=adr?adr.split(';').map(s=>s.trim()).filter(Boolean)[1]||'':'';
    return {name:fn,phone:tel.replace(/[^\d+\-() ]/g,''),email,city};
  };

  const handleVCF=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const text=await file.text();
    const data=parseVCard(text);
    if(!data.name&&!data.phone&&!data.email){
      showToast('Could not read contact from file');
      return;
    }
    setForm(f=>({...f,
      name:data.name||f.name,
      phone:data.phone||f.phone,
      email:data.email||f.email,
      city:data.city||f.city,
    }));
    showToast('Contact imported 💛');
    e.target.value='';
  };

  const importFromContacts=async()=>{
    if(navigator.contacts?.select){
      try{
        const props=['name','tel','email','address'];
        const supported=await navigator.contacts.getProperties();
        const pick=props.filter(p=>supported.includes(p));
        const results=await navigator.contacts.select(pick,{multiple:false});
        if(!results||results.length===0) return;
        const c=results[0];
        const name=(c.name&&c.name[0])||'';
        const phone=(c.tel&&c.tel[0])||'';
        const email=(c.email&&c.email[0])||'';
        const city=(c.address&&c.address[0]&&(c.address[0].city||c.address[0].region))||'';
        setForm(f=>({...f,
          name:name||f.name,
          phone:phone||f.phone,
          email:email||f.email,
          city:city||f.city,
        }));
        showToast('Contact imported 💛');
      }catch(e){
        if(e.name!=='AbortError') showToast('Could not access contacts');
      }
    } else {
      vcfRef.current.click();
    }
  };

  const save=()=>{
    if(!form.name.trim()){setErr('Name is required');return;}
    setErr(''); onSave(form);
  };

  return (
    <div style={{paddingBottom:120}}>
      {/* Import from Contacts */}
      <button onClick={importFromContacts} style={{
        width:'100%',padding:'12px 16px',borderRadius:14,marginBottom:4,
        background:C.card,border:`1.5px solid ${C.accent1}`,
        color:C.primary,fontSize:14,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
        Import from Contacts
      </button>
      <p style={{fontSize:11,color:C.textLight,textAlign:'center',marginBottom:20}}>
        On iPhone: open Contacts → share a contact → Save to Files, then select the file here
      </p>

      {/* Photo upload */}
      <div style={{textAlign:'center',marginBottom:24}}>
        <div style={{position:'relative',width:100,margin:'0 auto 10px'}}>
          <div style={{width:100,height:100,borderRadius:'50%',overflow:'hidden',
            boxShadow:'0 3px 12px rgba(0,0,0,.15)',cursor:'pointer'}}
            onClick={()=>fileRef.current.click()}>
            <PersonPhoto person={form} size={100} fontSize={48}/>
          </div>
          {/* Camera badge */}
          <div onClick={()=>fileRef.current.click()} style={{
            position:'absolute',bottom:2,right:2,width:28,height:28,borderRadius:'50%',
            background:C.accent1,display:'flex',alignItems:'center',justifyContent:'center',
            cursor:'pointer',boxShadow:'0 1px 4px rgba(0,0,0,.2)',fontSize:14}}>
            📷
          </div>
        </div>
        <input ref={fileRef} type="file" accept="image/*"
          style={{display:'none'}} onChange={handlePhotoUpload}/>
        <input ref={vcfRef} type="file" accept=".vcf,text/vcard"
          style={{display:'none'}} onChange={handleVCF}/>
        <button onClick={()=>setShowEmojiPicker(v=>!v)}
          style={{fontSize:12,color:C.textLight,marginTop:2}}>
          or choose an avatar emoji ↓
        </button>
      </div>

      {showEmojiPicker&&(
        <div style={{display:'flex',flexWrap:'wrap',gap:8,justifyContent:'center',
          padding:16,background:C.card,borderRadius:16,marginBottom:20}}>
          {PHOTO_EMOJIS.map(e=>(
            <button key={e} onClick={()=>{set('photo',e);set('photoData',null);setShowEmojiPicker(false);}}
              style={{fontSize:28,padding:6,borderRadius:10,
                background:!form.photoData&&form.photo===e?C.accent1:'transparent'}}>
              {e}
            </button>
          ))}
        </div>
      )}

      <div style={{display:'flex',flexDirection:'column',gap:20}}>
        <Field label="Name *">
          <input value={form.name} onChange={e=>{set('name',e.target.value);setErr('');}}
            placeholder="Their name" style={iSx}/>
          {err&&<p style={{color:'#DC2626',fontSize:12,marginTop:4}}>{err}</p>}
        </Field>

        <Field label="Relationship">
          <input value={form.relationship} onChange={e=>set('relationship',e.target.value)}
            placeholder="e.g. Best friend, Mentor, Grandmother" style={iSx}/>
        </Field>

        <Field label="How we met">
          <input value={form.howWeMet} onChange={e=>set('howWeMet',e.target.value)}
            placeholder="e.g. College, Work, Mutual friend, Church" style={iSx}/>
        </Field>

        <Field label="Circle">
          <Pills options={CATEGORIES} value={form.category} onChange={v=>set('category',v)}/>
        </Field>

        <Field label="Preferred way to reach them">
          <Pills options={CONTACT_PREFS} value={form.contactPref} onChange={v=>set('contactPref',v)}/>
        </Field>

        <Field label="Phone">
          <input value={form.phone} onChange={e=>set('phone',e.target.value)}
            placeholder="+1 (555) 000-0000" type="tel" style={iSx}/>
        </Field>

        <Field label="Email">
          <input value={form.email} onChange={e=>set('email',e.target.value)}
            placeholder="their@email.com" type="email" style={iSx}/>
        </Field>

        <Field label="City / Location">
          <input value={form.city||''} onChange={e=>set('city',e.target.value)}
            placeholder="e.g. Atlanta, New York, London" style={iSx}/>
        </Field>

        <Field label="Birthday">
          <input value={form.birthday} onChange={e=>set('birthday',e.target.value)}
            placeholder="e.g. March 15" style={iSx}/>
        </Field>

        <Field label="Since we last connected">
          <input type="date" max={new Date().toISOString().split('T')[0]}
            value={toDateInput(form.lastContactDate)}
            onChange={e=>set('lastContactDate',fromDateInput(e.target.value))}
            style={iSx}/>
        </Field>

        <Field label="Check-in Frequency">
          <Pills options={FREQUENCIES} value={form.frequency} onChange={v=>set('frequency',v)}/>
        </Field>

        <Field label="Notes">
          <textarea value={form.notes} onChange={e=>set('notes',e.target.value)}
            placeholder="Things to remember, upcoming events, what they love..."
            rows={3} style={{...iSx,resize:'none',lineHeight:1.5}}/>
        </Field>
      </div>

      <button onClick={save} style={{
        width:'100%',padding:16,borderRadius:16,marginTop:28,
        background:'linear-gradient(135deg,#D99C7C 0%,#F3C46F 100%)',
        color:'white',fontSize:16,fontFamily:'Georgia,serif',
        boxShadow:'0 4px 14px rgba(217,156,124,.4)'}}>
        {person?'Save Changes 💛':'Add to My People 💛'}
      </button>
    </div>
  );
}

// ── CategoriesView ────────────────────────────────────────────────────────────
function CategoriesView({people,navigate}) {

  return (
    <div style={{paddingBottom:100}}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>

            </div>

        })}

    </div>
  );
}

// ── CategoryDetailView ────────────────────────────────────────────────────────
function CategoryDetailView({category,people,navigate}) {
  const cp=people.filter(p=>p.category===category);
  return (
    <div style={{paddingBottom:100}}>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {cp.map(p=>{
          const d=daysSince(p.lastContactDate),over=isOverdue(p);
          return (
            <div key={p.id} onClick={()=>navigate('profile',p)}
              style={{padding:16,borderRadius:16,background:C.card,
                display:'flex',alignItems:'center',gap:14,cursor:'pointer'}}>
              <PersonPhoto person={p} size={52} fontSize={26}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,color:C.primary,marginBottom:2,fontSize:15}}>{p.name}</div>
                <div style={{fontSize:13,color:C.textLight}}>{p.relationship}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:12,color:over?C.accent1:C.textLight,fontWeight:over?600:400}}>
                  {d===null?'Never':d===0?'Today':`${d}d ago`}
                </div>
                <div style={{fontSize:11,color:C.textLight}}>{p.frequency}</div>
              </div>
            </div>
          );
        })}
        <div onClick={()=>navigate('add')} style={{padding:16,borderRadius:16,
          border:`2px dashed ${C.accent1}`,display:'flex',alignItems:'center',
          justifyContent:'center',gap:8,cursor:'pointer',color:C.accent1,fontSize:14}}>
          <Plus size={18} color={C.accent1}/> Add someone to {category}
        </div>
      </div>
    </div>
  );
}

// ── AnalyticsView ─────────────────────────────────────────────────────────────
function AnalyticsView({people}) {
  const wk =people.filter(p=>{const d=daysSince(p.lastContactDate);return d!==null&&d<=7;}).length;
  const mo =people.filter(p=>{const d=daysSince(p.lastContactDate);return d!==null&&d<=30;}).length;
  const ov =people.filter(isOverdue).length;
  const recent=[...people].filter(p=>p.lastContactDate)
    .sort((a,b)=>new Date(b.lastContactDate)-new Date(a.lastContactDate)).slice(0,4);
  const cats=CATEGORIES.filter(c=>people.some(p=>p.category===c));

  return (
    <div style={{paddingBottom:100}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:18}}>
        <div style={{padding:20,borderRadius:16,background:'linear-gradient(135deg,#D99C7C 0%,#F3C46F 100%)'}}>
          <div style={{fontSize:34,fontWeight:700,color:'white'}}>{wk}</div>
          <div style={{fontSize:13,color:'white',opacity:.9}}>this week</div>
        </div>
        <div style={{padding:20,borderRadius:16,background:C.card}}>
          <div style={{fontSize:34,fontWeight:700,color:C.primary}}>{mo}</div>
          <div style={{fontSize:13,color:C.textLight}}>this month</div>
        </div>
        <div style={{padding:20,borderRadius:16,background:C.card}}>
          <div style={{fontSize:34,fontWeight:700,color:C.primary}}>{people.length}</div>
          <div style={{fontSize:13,color:C.textLight}}>in your circle</div>
        </div>
        <div style={{padding:20,borderRadius:16,background:ov>0?'#FEF3C7':C.card}}>
          <div style={{fontSize:34,fontWeight:700,color:ov>0?'#D97706':C.primary}}>{ov}</div>
          <div style={{fontSize:13,color:C.textLight}}>need a check-in</div>
        </div>
      </div>

      {recent.length>0&&(
        <div style={{padding:20,borderRadius:16,background:C.card,marginBottom:14}}>
          <h3 style={{fontSize:17,fontFamily:'Georgia,serif',color:C.primary,marginBottom:14}}>Recently Connected</h3>
          {recent.map(p=>{
            const d=daysSince(p.lastContactDate);
            return (
              <div key={p.id} style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
                <span style={{fontSize:26}}>{p.photo}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,color:C.primary,fontSize:14}}>{p.name}</div>
                  <div style={{fontSize:12,color:C.textLight}}>{p.category}</div>
                </div>
                <div style={{fontSize:13,color:C.accent1,fontWeight:500}}>
                  {d===0?'Today':d===1?'Yesterday':`${d}d ago`}
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div style={{padding:20,borderRadius:16,background:C.card}}>
        <h3 style={{fontSize:17,fontFamily:'Georgia,serif',color:C.primary,marginBottom:14}}>By Circle</h3>
        {cats.map(cat=>{
          const count=people.filter(p=>p.category===cat).length;
          const pct=people.length>0?Math.round((count/people.length)*100):0;
          return (
            <div key={cat} style={{marginBottom:14}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
                <span style={{fontSize:14,color:C.primary}}>{cat}</span>
                <span style={{fontSize:14,color:C.textLight}}>{count}</span>
              </div>
              <div style={{height:6,borderRadius:4,background:C.light,overflow:'hidden'}}>
                <div style={{height:'100%',width:`${pct}%`,borderRadius:4,
                  background:'linear-gradient(90deg,#D99C7C,#F3C46F)'}}/>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [people,setPeople]=useState([]);
  const [events,setEvents]=useState([]);
  const [selectedEvent,setSelectedEvent]=useState(null);
  const [view,setView]=useState('home');
  const [selPerson,setSelPerson]=useState(null);
  const [catFilter,setCatFilter]=useState(null);
  const [editPerson,setEditPerson]=useState(null);
  const [toast,setToast]=useState(null);
  const [ready,setReady]=useState(false);

  useEffect(()=>{
    try{ const s=localStorage.getItem('mypeople_v1'); setPeople(s?JSON.parse(s):SAMPLE); }
    catch{ setPeople(SAMPLE); }
    try{ const e=localStorage.getItem('mypeople_events'); if(e) setEvents(JSON.parse(e)); }
    catch{}
    setReady(true);
  },[]);

  useEffect(()=>{ if(ready) localStorage.setItem('mypeople_v1',JSON.stringify(people)); },[people,ready]);
  useEffect(()=>{ if(ready) localStorage.setItem('mypeople_events',JSON.stringify(events)); },[events,ready]);

  const addEvent=ev=>{ setEvents(prev=>[...prev,ev]); showToast('Meetup saved 💛'); };
  const updateEvent=ev=>{ setEvents(prev=>prev.map(e=>e.id===ev.id?ev:e)); showToast('Meetup updated 💛'); };
  const deleteEvent=id=>{ setEvents(prev=>prev.filter(e=>e.id!==id)); showToast('Event cancelled'); };

  const showToast=msg=>{ setToast(msg); setTimeout(()=>setToast(null),2500); };

  const navigate=(v,person=null,cat=null)=>{
    setView(v); setSelPerson(person); setCatFilter(cat);
    if(v!=='add') setEditPerson(null);
    window.scrollTo({top:0,behavior:'smooth'});
  };

  const handleSave=data=>{
    if(editPerson){
      setPeople(prev=>prev.map(p=>p.id===data.id?data:p));
      showToast('Profile updated 💛');
      navigate('profile',data);
    } else {
      const np={...data,id:Date.now()+Math.random(),lastContactDate:null};
      setPeople(prev=>[...prev,np]);
      showToast('Added to your people 💛');
      navigate('home');
    }
  };

  const handleDelete=id=>{ setPeople(prev=>prev.filter(p=>p.id!==id)); showToast('Removed'); navigate('home'); };

  const handleLog=person=>{
    const now=new Date().toISOString();
    setPeople(prev=>prev.map(p=>p.id===person.id?{...p,lastContactDate:now}:p));
    setSelPerson(prev=>prev?{...prev,lastContactDate:now}:prev);
    showToast('Connection logged! 💛');
  };

  const handleEdit=person=>{ setEditPerson(person); navigate('add'); };

  const livePerson=selPerson?(people.find(p=>p.id===selPerson.id)||selPerson):null;

  const titles={home:null,profile:livePerson?.name,add:editPerson?`Edit ${editPerson.name}`:'Add Person',
    gestures:'Thoughtful Gestures',categories:'Your Circles',cat:catFilter,analytics:'Circle Analytics'};

  const goBack=()=>{
    if(view==='add'&&editPerson) navigate('profile',editPerson);
    else if(view==='profile')   navigate('home');
    else if(view==='cat')       navigate('categories');
    else                        navigate('home');
  };

  if(!ready) return null;

  return (
    <div style={{maxWidth:480,margin:'0 auto',minHeight:'100vh',background:C.bg}}>
      {/* Header */}
      <div style={{position:'sticky',top:0,zIndex:100,background:C.bg,padding:'14px 24px 0'}}>
        {view!=='home'&&(
          <button onClick={goBack}
            style={{color:C.accent1,fontSize:14,display:'flex',alignItems:'center',gap:4,marginBottom:6}}>
            <Back size={15} color={C.accent1}/> Back
          </button>
        )}
        {titles[view]&&(
          <h2 style={{fontSize:22,fontFamily:'Georgia,serif',color:C.primary,paddingBottom:10}}>
            {titles[view]}
          </h2>
        )}
      </div>

      {/* Content */}
      <div style={{padding:'12px 24px 0'}}>
        {view==='home'&&<HomeView people={people} events={events} navigate={navigate} onEventClick={setSelectedEvent}/>}
        {view==='profile'&&livePerson&&<ProfileView person={livePerson} events={events} onEdit={handleEdit} onDelete={handleDelete} onLogConnection={handleLog} onSchedule={addEvent} onEventClick={setSelectedEvent}/>}
        {view==='add'&&<AddEditView person={editPerson} onSave={handleSave} showToast={showToast}/>}
        {view==='gestures'&&<GesturesView showToast={showToast}/>}
        {view==='categories'&&<CategoriesView people={people} navigate={navigate}/>}
        {view==='cat'&&<CategoryDetailView category={catFilter} people={people} navigate={navigate}/>}
        {view==='analytics'&&<AnalyticsView people={people}/>}
      </div>

      {/* Bottom nav */}
      <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',
        width:'100%',maxWidth:480,padding:'12px 32px',
        display:'flex',justifyContent:'space-around',background:C.primary,
        boxShadow:'0 -4px 20px rgba(0,0,0,.15)'}}>
        {[
          {id:'home',    label:'Home',      icon:<Heart size={24} color={view==='home'?'#F3C46F':'#D99C7C'} fill={view==='home'?'#F3C46F':'none'}/>},
          {id:'categories',label:'Circles', icon:<Users size={24} color={view==='categories'?'#F3C46F':'#D99C7C'}/>},
          {id:'gestures',label:'Gestures',  icon:<Gift  size={24} color={view==='gestures' ?'#F3C46F':'#D99C7C'}/>},
          {id:'analytics',label:'Analytics',icon:<Trend size={24} color={view==='analytics'?'#F3C46F':'#D99C7C'}/>},
        ].map(tab=>(
          <button key={tab.id} onClick={()=>navigate(tab.id)}
            style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,
              color:view===tab.id?'#F3C46F':'#D99C7C',fontSize:11}}>
            {tab.icon}<span>{tab.label}</span>
          </button>
        ))}
      </div>

      {selectedEvent&&(()=>{
        const p=people.find(x=>x.id===selectedEvent.personId)||{name:selectedEvent.personName,photo:'👤',photoData:null};
        return <EventDetailModal event={selectedEvent} person={p}
          onUpdate={ev=>{updateEvent(ev);setSelectedEvent(null);}}
          onDelete={id=>{deleteEvent(id);setSelectedEvent(null);}}
          onClose={()=>setSelectedEvent(null)}/>;
      })()}
      {toast&&<Toast msg={toast}/>}
    </div>
  );
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
